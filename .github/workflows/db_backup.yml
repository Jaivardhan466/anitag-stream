name: Supabase Scheduled Backup & Health Check

# =============================================================================
# IMPORTANT GITHUB ACTIONS & SUPABASE OPERATIONAL SPECIFICATIONS:
# 1. SCHEDULED EXECUTION CONSTRAINT:
#    GitHub Actions scheduled workflows ('cron') ONLY execute from the repository's
#    default branch (e.g. 'main'). Scheduled triggers DO NOT run on feature branches
#    such as 'phase1-core-improvements'. Prior to merging to main, run backups locally
#    via 'npm run db:backup' or manually in GitHub via 'workflow_dispatch'.
#
# 2. APPLICATION-LEVEL AES-256-GCM ENCRYPTION:
#    All database snapshots are encrypted at the application layer with a 256-bit
#    symmetric key (derived via PBKDF2-SHA256 with 100,000 iterations). Plaintext
#    JSON is never stored in artifacts or committed to git.
#
# 3. SUPABASE BEST-EFFORT HEALTH CHECK:
#    This workflow executes a best-effort diagnostic health check query against the
#    Supabase PostgREST endpoint to confirm connectivity and responsiveness.
#    Failed checks are reported honestly in the log. This request is strictly a
#    health diagnostic and does not claim to prevent Supabase inactivity pausing.
#    Direct project monitoring via the Supabase dashboard remains necessary.
# =============================================================================

on:
  schedule:
    # Runs daily at 03:00 UTC (Only activates once merged to default branch)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry-run check without permanent archival'
        required: false
        default: 'false'
        type: boolean

jobs:
  backup-and-healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 1: Authenticated Best-Effort Health Query
      - name: Authenticated Supabase Best-Effort Health Check
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "[Health Check] Dispatching authenticated health query to Supabase PostgREST..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=count" || echo "000")
          
          echo "[Health Check] Supabase API responded with HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "[Health Check] Status OK: Database responded successfully to health check."
          else
            echo "[Health Check Error] Health check failed with HTTP status $HTTP_STATUS. Database may be offline, unreachable, or credentials invalid."
          fi

      # Step 2: Full Database Export with AES-256-GCM Encryption (Fails workflow on any error)
      - name: Execute Encrypted Backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          # Node script handles pagination, SHA-256 checksums, AES-256-GCM encryption, and manifest generation
          # Any table export failure or missing credentials causes process.exit(1), failing the step immediately
          node src/engine/db/backup.js

      # Step 3: Archive Encrypted Artifacts Only (Fails if backup artifact is missing or incomplete)
      - name: Upload Encrypted Backup Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: anitag-encrypted-database-backup
          path: |
            backups/*.enc
            backups/*.manifest.json
          retention-days: 30
          if-no-files-found: error
